<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Claudex</title>
<link rel="icon" href="/icon-64.png" sizes="64x64"><link rel="icon" href="/icon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="/icon-180.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#1f1f1e"><link rel="stylesheet" href="/app.css">
<style>body{display:grid;place-items:center;min-height:100dvh;overflow:auto}main{width:min(360px,calc(100vw - 32px));display:grid;gap:18px;text-align:center;justify-items:center}img{width:64px;height:64px;border-radius:16px}h1{margin:0;font-size:1.5em;font-weight:600}.btn{justify-content:center;width:100%;padding:12px 16px;font-size:1em;border-radius:12px;background:var(--text);color:#1a1a19;border-color:var(--text)}.btn:hover{background:#fff}.btn:disabled{opacity:.6}p{margin:0;color:var(--danger);min-height:1.5em}</style></head>
<body><main>
<img src="/logo.svg" alt=""><h1>Claudex</h1>
<button type="button" class="btn" id="go"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M45 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.7-2.1 5-4.4 6.6v5.5h7.1C42.6 36.8 45 31.2 45 24.5z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7C8.1 41.1 15.5 46 24 46z"/><path fill="#FBBC05" d="M11.8 28.3c-.4-1.3-.7-2.8-.7-4.3s.3-3 .7-4.3V14H4.5C3 17 2.2 20.4 2.2 24s.8 7 2.3 10l7.3-5.7z"/><path fill="#EA4335" d="M24 10.7c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.2 29.9 2 24 2 15.5 2 8.1 6.9 4.5 14l7.3 5.7c1.7-5.2 6.5-9 12.2-9z"/></svg>Sign in with Google</button>
<p id="m" role="alert"></p>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
const FB = {{FB}}, HD = {{HD}}, go = document.getElementById("go"), m = document.getElementById("m");
if (!FB.apiKey || !FB.projectId) { go.disabled = true; m.textContent = "Sign-in isn't set up yet: add your Firebase web config to config.json."; throw new Error("no firebase config"); }
const auth = getAuth(initializeApp(FB)), google = new GoogleAuthProvider();
google.setCustomParameters(HD ? { hd: HD, prompt: "select_account" } : { prompt: "select_account" });
go.addEventListener("click", async () => {
  go.disabled = true; m.textContent = "";
  try {
    const { user } = await signInWithPopup(auth, google);
    const r = await fetch("/login/google", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: await user.getIdToken() }) }), out = await r.json();
    await signOut(auth); if (r.ok) return location.reload(); m.textContent = out.error;
  } catch (e) { m.textContent = e.code === "auth/unauthorized-domain" ? "This address isn't on the Google sign-in list yet." : e.code === "auth/popup-closed-by-user" ? "" : "Sign-in didn't finish."; }
  go.disabled = false;
});
</script></body></html>
